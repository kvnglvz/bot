<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Results · IPC Board of Trustees Ballot 2026</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085;
      --line: #e3e6eb; --accent: #2457d6; --accent-soft: #e8eefc;
      --ok: #157f3b; --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 14px 64px; }
    h1 { font-size: 1.4rem; line-height: 1.25; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 18px; margin-bottom: 14px;
    }
    .card h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .toggle {
      padding: 6px 12px; font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer;
      color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    }
    .toggle[aria-pressed=true] { color: #fff; background: var(--accent); border-color: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .stat b { display: block; font-size: 1.6rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: .9rem; }
    .row { display: grid; grid-template-columns: 24px 48px 1fr; gap: 12px; align-items: center; padding: 10px 0; }
    .row + .row { border-top: 1px solid var(--line); }
    .rank { color: var(--muted); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    .row img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #eef0f3; }
    .line { display: flex; justify-content: space-between; gap: 8px; }
    .line .name { font-weight: 500; }
    .line .count { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .line .count small { color: var(--muted); font-weight: 400; }
    .bar { height: 8px; background: var(--accent-soft); border-radius: 999px; margin-top: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
    .meta { color: var(--muted); font-size: .85rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; background: #fef3f2; color: var(--err); }
    .msg.info { background: var(--accent-soft); color: var(--text); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>IPC Board of Trustees Ballot 2026</h1>
  <p class="sub">Results</p>

  <p class="meta">
    <span id="updated">Loading…</span>
    <button type="button" class="toggle" id="autoBtn" aria-pressed="true"></button>
  </p>

  <div id="msg" class="msg hidden"></div>

  <div id="results" class="hidden">
    <div class="card">
      <h2>Turnout</h2>
      <div class="stats" id="stats"></div>
    </div>
    <div class="card">
      <h2>Votes per nominee</h2>
      <div id="nominees"></div>
    </div>
  </div>
</main>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx83KC_CV304Upd4bXHxibkGCTB2z9PTqinv9zkLVNkulabuI6VbX_a3m5hJlqGCRDQVg/exec';
const REFRESH_MS = 30000;

// Blank person silhouette, used when a nominee has no photo or it fails to load
const DEFAULT_PHOTO = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#e4e7ec"/>' +
  '<circle cx="32" cy="25" r="11" fill="#98a2b3"/><path d="M12 58c0-12 9-19 20-19s20 7 20 19z" fill="#98a2b3"/></svg>'
);

// Same approach as index.html: Apps Script sometimes hangs, so abort slow requests and retry.
const TIMEOUT_MS = 8000;
const ATTEMPTS = 3;

const $ = (id) => document.getElementById(id);
let loading = false;
let auto = localStorage.getItem('resultsAuto') !== 'off'; // auto-refresh, on by default

async function fetchJson(opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(SCRIPT_URL + '?action=results', { ...opts, signal: ctrl.signal });
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function withRetry(opts) {
  for (let i = 1; ; i++) {
    try {
      return await fetchJson(opts);
    } catch (e) {
      console.warn(`Attempt ${i} failed:`, e);
      if (i >= ATTEMPTS) throw e;
    }
  }
}

function showMsg(text, type = 'err') {
  $('msg').textContent = text;
  $('msg').className = 'msg ' + type + (text ? '' : ' hidden');
}

function pct(n, of) {
  return of ? Math.round((n / of) * 100) : 0;
}

function stat(value, label) {
  const div = document.createElement('div');
  div.className = 'stat';
  const b = document.createElement('b');
  b.textContent = value;
  const span = document.createElement('span');
  span.textContent = label;
  div.append(b, span);
  return div;
}

function render(r) {
  $('stats').replaceChildren(
    r.members
      ? stat(`${r.ballots} / ${r.members}`, `members voted (${pct(r.ballots, r.members)}%)`)
      : stat(r.ballots, 'ballots cast'),
    stat(r.proxies, `by proxy (${pct(r.proxies, r.ballots)}%)`),
  );

  // Highest first. Bars and % are out of all ballots, since each ballot can pick several nominees.
  const sorted = [...r.nominees].sort((a, b) => b.votes - a.votes);
  $('nominees').replaceChildren(...sorted.map(n => {
    const row = document.createElement('div');
    row.className = 'row';
    const rank = document.createElement('span');
    rank.className = 'rank';
    // Tied nominees share a rank
    rank.textContent = sorted.findIndex(x => x.votes === n.votes) + 1;
    const img = document.createElement('img');
    img.alt = ''; img.width = 48; img.height = 48;
    img.onerror = () => { img.onerror = null; img.src = DEFAULT_PHOTO; };
    img.src = n.photo || DEFAULT_PHOTO;
    const body = document.createElement('div');
    const line = document.createElement('div');
    line.className = 'line';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = n.name;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `${n.votes} `;
    const share = document.createElement('small');
    share.textContent = `(${pct(n.votes, r.ballots)}%)`;
    count.append(share);
    line.append(name, count);
    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('i');
    fill.style.width = pct(n.votes, r.ballots) + '%';
    bar.append(fill);
    body.append(line, bar);
    row.append(rank, img, body);
    return row;
  }));

}

function setUpdated(when) {
  $('updated').textContent = `Updated ${when.toLocaleTimeString()}`;
}

function renderAuto() {
  const btn = $('autoBtn');
  btn.setAttribute('aria-pressed', auto);
  btn.textContent = auto ? `Auto-refresh: On (${REFRESH_MS / 1000} s)` : 'Auto-refresh: Off';
}

// Fetch and show results. Returns quietly if a fetch is already running.
async function refresh() {
  if (loading) return;
  loading = true;
  try {
    const r = await withRetry({});
    setUpdated(new Date());
    if (!r.ok) {
      $('results').classList.add('hidden');
      return showMsg(r.error || 'Results are not available.', r.code === 'notYet' ? 'info' : 'err');
    }
    showMsg('');
    $('results').classList.remove('hidden');
    render(r);
  } catch (e) {
    // Keep showing the last results; the next refresh will try again
    showMsg(auto ? 'Could not reach the server. Retrying shortly…' : 'Could not reach the server. Please refresh the page.');
  } finally {
    loading = false;
  }
}

$('autoBtn').addEventListener('click', () => {
  auto = !auto;
  localStorage.setItem('resultsAuto', auto ? 'on' : 'off');
  renderAuto();
  if (auto) refresh();
});

// Auto-refresh, paused while the tab is hidden; refresh right away when it comes back
setInterval(() => { if (auto && !document.hidden) refresh(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (auto && !document.hidden) refresh(); });

renderAuto();
refresh();
</script>
</body>
</html>
